<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CONVENI DELUXE - コンビニ経営ゲーム</title>
<meta name="description" content="おにぎり1個から始めるコンビニ経営シミュレーション。レジで長押しスキャンして接客、パソコンで商品追加やアップグレード、バイトを雇って自動化しよう。">
<link rel="canonical" href="https://kaikomziu.github.io/conveni-deluxe/">
<meta property="og:title" content="CONVENI DELUXE - コンビニ経営ゲーム">
<meta property="og:description" content="おにぎり1個から始めるコンビニ経営シミュレーション。長押しスキャンで接客し、商品追加・アップグレード・バイト雇用でお店を大きくしよう。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kaikomziu.github.io/conveni-deluxe/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">🏪 <span>CONVENI<b>DELUXE</b></span></div>
    <div class="stats-mini">
      <div class="money-display" id="moneyDisplay">¥0</div>
      <div class="rep-display" id="repDisplay" title="評判">⭐ 50</div>
    </div>
    <nav class="view-tabs">
      <button class="tab-btn active" data-view="shop">🏪 店内</button>
      <button class="tab-btn" data-view="pc">💻 PC</button>
      <button class="help-btn" id="helpBtn" title="遊び方">❓</button>
    </nav>
  </header>

  <main id="main">

    <!-- ============ SHOP VIEW ============ -->
    <section id="shopView" class="view active">

      <div class="queue-wrap">
        <div class="queue-label">お客さんの列 <span id="queueCount">0</span>/<span id="queueMax">6</span></div>
        <div class="queue-row" id="queueRow"></div>
      </div>

      <div class="counter-wrap">
        <div class="counter-label">レジカウンター</div>
        <div class="lanes-row" id="lanesRow"></div>
      </div>

      <div class="shop-stats">
        <div class="shop-stat"><span class="k">累計売上</span><span class="v" id="statTotalEarned">¥0</span></div>
        <div class="shop-stat"><span class="k">接客数</span><span class="v" id="statServed">0</span></div>
        <div class="shop-stat"><span class="k">逃した客</span><span class="v" id="statLost">0</span></div>
      </div>

    </section>

    <!-- ============ PC VIEW ============ -->
    <section id="pcView" class="view">
      <div class="pc-frame">
        <div class="pc-topbar">
          <div class="pc-title">💻 店長用パソコン</div>
          <div class="pc-money">所持金 <b id="pcMoney">¥0</b></div>
        </div>
        <nav class="pc-tabs">
          <button class="pc-tab-btn active" data-pctab="products">📦 商品</button>
          <button class="pc-tab-btn" data-pctab="equip">🛠️ 設備</button>
          <button class="pc-tab-btn" data-pctab="staff">👷 人材</button>
          <button class="pc-tab-btn" data-pctab="settings">⚙️ 設定</button>
        </nav>
        <div class="pc-body">
          <div class="pc-panel active" id="panelProducts"></div>
          <div class="pc-panel" id="panelEquip"></div>
          <div class="pc-panel" id="panelStaff"></div>
          <div class="pc-panel" id="panelSettings"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="toastWrap"></div>
  <div id="floatWrap"></div>

  <div id="offlineModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">🌙 おかえりなさい！</div>
      <div class="modal-body" id="offlineBody"></div>
      <button class="modal-close" id="offlineClose">お店を開ける</button>
    </div>
  </div>

  <div id="tutorialModal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-skip" id="tutorialSkip">スキップ</button>
      <div class="tut-icon" id="tutIcon"></div>
      <div class="modal-title" id="tutTitle"></div>
      <div class="modal-body" id="tutBody"></div>
      <div class="tut-dots" id="tutDots"></div>
      <div class="tut-nav">
        <button class="modal-close secondary" id="tutPrev">もどる</button>
        <button class="modal-close" id="tutNext">つぎへ</button>
      </div>
    </div>
  </div>

</div>

<script src="js/game.js" defer></script>
</body>
</html>
